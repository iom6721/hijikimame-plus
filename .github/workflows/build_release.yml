name: Build and Release (Windows)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pip
          pip install pyinstaller pillow requests

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --add-data "hijikimame_body.png;." --add-data "takoyaki.png;." --add-data "3.png;." --add-data "exit_animation.gif;." --add-data "nijiki;nijiki" --icon hijikimame_desktop.ico hijikimame_desktop.py

      - name: Generate SHA256 for EXE
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          p = 'dist/hijikimame_desktop.exe'
          h = hashlib.sha256()
          with open(p, 'rb') as f:
              for chunk in iter(lambda: f.read(8192), b''):
                  h.update(chunk)
          s = h.hexdigest()
          with open('dist/hijikimame_desktop.exe.sha256', 'w') as out:
              out.write(s + '  hijikimame_desktop.exe\n')
          print(s)
          PY

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}


            + 画像追尾機能の安定化
            + 設定の追加
              + 画像追尾の全画面on/off
              + 画像追尾の感度調整
            + アップデート機能の改善
          draft: false
          prerelease: false
          files: |
            dist/hijikimame_desktop.exe
            dist/hijikimame_desktop.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
