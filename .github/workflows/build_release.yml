name: Build and Release (Windows)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm hijikimame_desktop.spec
          if (-not (Test-Path "dist/hijikimame_desktop.exe")) {
            throw "PyInstaller did not produce dist/hijikimame_desktop.exe"
          }

      - name: Generate SHA256 for EXE
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/hijikimame_desktop.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/hijikimame_desktop.exe.sha256" -Value "$hash  hijikimame_desktop.exe" -NoNewline
          Write-Host $hash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            + UIをtinkerからpysideへ変更。
            + Discord連携のON/OFFを切り替えできるように変更。
          draft: false
          prerelease: false
          files: |
            dist/hijikimame_desktop.exe
            dist/hijikimame_desktop.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
